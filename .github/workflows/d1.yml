# Cloudflare D1 migrations + healthcheck. See issue #670 FR5.
#
# - On PRs that touch `db/migrations/**` or `workers/api/**`: apply migrations
#   to `virtualrow-dev` (remote), deploy the Worker to the `dev` env, curl
#   `/health/db` and assert `{"ok":true}`.
# - On pushes to `main`: the same against `virtualrow-prod` + the production
#   Worker.
# - Weekly: curl the production `/health/db` and fail the job on a non-200.
#
# The `CLOUDFLARE_API_TOKEN` must be scoped to D1:edit on the two DBs and
# Workers:edit on the two Workers only (NFR1, D5). See docs/d1.md.
name: d1

on:
  pull_request:
    paths:
      - 'db/migrations/**'
      - 'workers/api/**'
      - '.github/workflows/d1.yml'
  push:
    branches: [main]
    paths:
      - 'db/migrations/**'
      - 'workers/api/**'
      - '.github/workflows/d1.yml'
  schedule:
    - cron: '0 6 * * 1'  # Monday 06:00 UTC
  workflow_dispatch:

concurrency:
  group: d1-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate-and-deploy:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Guard — require Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set as repo secrets. See docs/d1.md."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'workers/api/package-lock.json'
      - name: Install Worker deps
        working-directory: workers/api
        run: npm ci
      - name: Decide environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "db=virtualrow-prod" >> "$GITHUB_OUTPUT"
            echo "wrangler_env=production" >> "$GITHUB_OUTPUT"
          else
            echo "db=virtualrow-dev" >> "$GITHUB_OUTPUT"
            echo "wrangler_env=dev" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply migrations (${{ steps.env.outputs.db }} --remote)
        working-directory: workers/api
        run: npx wrangler d1 migrations apply ${{ steps.env.outputs.db }} --remote
      - name: Deploy Worker (--env ${{ steps.env.outputs.wrangler_env }})
        id: deploy
        working-directory: workers/api
        run: |
          npx wrangler deploy --env ${{ steps.env.outputs.wrangler_env }}
      - name: Resolve Worker URL
        id: url
        run: |
          if [ "${{ steps.env.outputs.wrangler_env }}" = "production" ]; then
            name="virtualrow-api"
          else
            name="virtualrow-api-dev"
          fi
          subdomain=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const j=JSON.parse(d);process.stdout.write(j.result.subdomain||"");})')
          if [ -z "$subdomain" ]; then
            echo "::error::Could not read Workers subdomain"
            exit 1
          fi
          echo "url=https://${name}.${subdomain}.workers.dev" >> "$GITHUB_OUTPUT"
      - name: Curl /health/db
        run: |
          url="${{ steps.url.outputs.url }}/health/db"
          echo "GET $url"
          body=$(curl -sS --fail --retry 3 --retry-delay 5 "$url")
          echo "Response: $body"
          echo "$body" | grep -q '"ok":true' || {
            echo "::error::Healthcheck did not return ok:true"
            exit 1
          }

  scheduled-healthcheck:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Guard — require Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set as repo secrets. See docs/d1.md."
            exit 1
          fi
      - name: Resolve subdomain and curl prod /health/db
        run: |
          subdomain=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const j=JSON.parse(d);process.stdout.write(j.result.subdomain||"");})')
          if [ -z "$subdomain" ]; then
            echo "::error::Could not read Workers subdomain"
            exit 1
          fi
          url="https://virtualrow-api.${subdomain}.workers.dev/health/db"
          echo "GET $url"
          code=$(curl -sS -o /tmp/body.txt -w "%{http_code}" --retry 3 --retry-delay 5 "$url")
          cat /tmp/body.txt
          if [ "$code" != "200" ]; then
            echo "::error::Scheduled healthcheck returned HTTP $code"
            exit 1
          fi
          grep -q '"ok":true' /tmp/body.txt || {
            echo "::error::Scheduled healthcheck body did not include ok:true"
            exit 1
          }
