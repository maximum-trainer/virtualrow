name: Regenerate marketing screenshots

# #648 — reusable workflow that renders every PNG under docs/*.png on the
# real-GPU runner and uploads them as `artifact-name` for the caller. The
# WebGPU engine declines SwiftShader (reason `software-adapter`), so this
# only works on `linux-nvidia-gpu-runner` (#648 FR2 / AC4).
#
# The caller is responsible for honouring the fallback-on-outage path (#648
# FR8 / D5 = b): if this workflow is skipped (GPU_RUNNER_DISABLED set) or
# fails, the deploy publishes the committed `docs/*.png` unchanged.
#
# Also fires on-demand from a PR carrying the `regen-marketing-shots` label
# (#648 D10 = c): the PR gets a workflow-artifact Dan can eyeball without
# merging.

on:
  workflow_call:
    inputs:
      ref:
        description: Commit SHA (or ref) to check out and render against.
        required: true
        type: string
      artifact-name:
        description: Name for the uploaded artifact that holds the PNGs + report.json.
        required: true
        type: string
      retention-days:
        description: Days to keep the artifact. Default 14.
        required: false
        type: number
        default: 14
      commit-back-branch:
        description: >-
          Branch to push regenerated PNGs back to on a successful real-GPU run.
          Empty string disables commit-back. Only the deploy-pages caller sets
          this (to `main`) — the PR-label path leaves it empty so a label-only
          regen never writes to the branch.
        required: false
        type: string
        default: ''

  pull_request:
    types: [labeled]

concurrency:
  # One regen run per ref at a time; later triggers coalesce.
  group: regen-marketing-shots-${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  render:
    name: Render marketing screenshots on GPU runner
    # Fires on workflow_call directly, or on a PR being labelled with
    # `regen-marketing-shots` (#648 D10). Gated by the shared kill-switch so
    # the job skips (rather than hangs) when the fleet GPU runner is offline.
    if: >-
      ${{ (github.event_name != 'pull_request'
           || github.event.label.name == 'regen-marketing-shots')
          && vars.GPU_RUNNER_DISABLED != 'true' }}
    runs-on: linux-nvidia-gpu-runner
    continue-on-error: false
    timeout-minutes: 20
    # #648 follow-up: the commit-back step pushes regenerated PNGs back to
    # the caller's branch (main) so a later deploy that lands on a non-GPU
    # fleet VM still ships recent images via the fallback path. The PR-label
    # trigger passes an empty `commit-back-branch`, so no write happens there.
    permissions:
      contents: write
    env:
      CI: true
      # #648 AC10 — budget is tracked via the per-shot gpuMs in report.json;
      # this hard timeout is a safety net, not the budget itself.
      MARKETING_OUT_DIR: ${{ github.workspace }}/playwright-report/marketing-shots
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install Vulkan runtime for the NVIDIA GPU
        # Same recipe as next-branch-ci.yml webgpu-engine: the AI/HPC image
        # lacks the Vulkan userspace Chromium's WebGPU backend needs. Without
        # it the engine declines (`software-adapter`) and every shot
        # fast-fails (#648 AC4).
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan1 vulkan-tools libgl1 libegl1
          # nvidia-smi writes its "has failed" error to stdout, so a prior
          # 2>/dev/null doesn't suppress it and $DRV_MAJOR ended up holding
          # the whole error message. Keep only output that looks like a
          # version number (digits + dot).
          DRV_MAJOR=$(nvidia-smi --query-gpu=driver_version --format=csv,noheader 2>&1 \
            | grep -E '^[0-9]+\.' | head -1 | cut -d. -f1)
          if [ -n "$DRV_MAJOR" ]; then
            sudo apt-get install -y --no-install-recommends "libnvidia-gl-$DRV_MAJOR" \
              || echo "libnvidia-gl-$DRV_MAJOR not available via apt — relying on the image's own ICD"
          fi

      # Temporary diagnostic — the AI/HPC image's apt `libnvidia-gl-$DRV_MAJOR`
      # install blocks on CUDA package conflicts
      # (`libnvidia-compute-$DRV-server` Conflicts: libcuda-10.0-1 .. 12.7-1),
      # so even on a VM with the T4 attached the ICD never installs via apt
      # and Chromium's WebGPU keeps declining as software-adapter. This step
      # prints what the image already ships (ICD files, loader cache, what
      # vulkaninfo sees) so a follow-up PR can either point VK_ICD_FILENAMES
      # at the pre-installed ICD or install only the pieces that don't fight
      # with CUDA. `set +e` + `exit 0` keep the job green while we gather
      # data; this step comes out once the fix lands.
      - name: Diagnose Vulkan / NVIDIA runtime (#648 follow-up, temporary)
        if: always()
        run: |
          set +e
          echo "=== uname / lsb_release ==="
          uname -a
          lsb_release -a 2>&1 | tail -4
          echo
          echo "=== nvidia-smi -L ==="
          nvidia-smi -L 2>&1
          echo
          echo "=== /usr/share/vulkan/icd.d/ ==="
          ls -la /usr/share/vulkan/icd.d/ 2>&1
          echo "=== /etc/vulkan/icd.d/ ==="
          ls -la /etc/vulkan/icd.d/ 2>&1
          echo "=== /usr/local/share/vulkan/icd.d/ ==="
          ls -la /usr/local/share/vulkan/icd.d/ 2>&1
          echo "=== cat any ICD JSONs found ==="
          for d in /usr/share/vulkan/icd.d /etc/vulkan/icd.d /usr/local/share/vulkan/icd.d; do
            for f in "$d"/*.json; do
              [ -e "$f" ] || continue
              echo "--- $f ---"
              cat "$f"
            done
          done
          echo
          echo "=== ldconfig -p | grep -iE 'glx|vulkan|nvidia' ==="
          ldconfig -p | grep -iE 'glx|vulkan|nvidia' 2>&1 | head -40
          echo
          echo "=== vulkaninfo --summary (first 60 lines) ==="
          vulkaninfo --summary 2>&1 | head -60
          echo
          echo "=== env ==="
          echo "VK_ICD_FILENAMES=${VK_ICD_FILENAMES:-<unset>}"
          echo "VK_LAYER_PATH=${VK_LAYER_PATH:-<unset>}"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-<unset>}"
          echo
          echo "=== find / -name 'libGLX_nvidia*' -o -name 'libnvidia-glvkspirv*' 2>/dev/null ==="
          find / \( -name 'libGLX_nvidia*' -o -name 'libnvidia-glvkspirv*' -o -name 'nvidia_icd*' \) 2>/dev/null | head -40
          exit 0

      - name: Render marketing screenshots (#648 FR1 / AC1)
        run: |
          mkdir -p "$MARKETING_OUT_DIR"
          npx playwright test --config=playwright/playwright.config.marketing.ts

      - name: Summarise rendered shots
        if: always()
        run: |
          echo "## Marketing screenshots" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$MARKETING_OUT_DIR/report.json" ]; then
            node -e '
              const r = require(process.env.MARKETING_OUT_DIR + "/report.json");
              const shots = r.shots || [];
              const ready = shots.filter(s => s.outcome === "ready").length;
              const fallback = shots.filter(s => s.outcome === "fallback").length;
              const rows = shots.map(s => `| ${s.file} | ${s.outcome} | ${s.bytes} B | gpuMs=${s.gpuMs ?? "?"} | draws=${s.drawCalls ?? "?"} |`).join("\n");
              const head = "| file | outcome | bytes | gpuMs | draws |\n| --- | --- | --- | --- | --- |";
              const fs = require("fs");
              if (ready === 0 && fallback > 0) {
                fs.appendFileSync(
                  process.env.GITHUB_STEP_SUMMARY,
                  `_Runner landed on a non-GPU fleet VM — every shot skipped (software adapter). Site stays on the committed fallback PNGs._\n\n`,
                );
              }
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, head + "\n" + rows + "\n");
            '
          else
            echo "report.json was not produced" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload marketing-shots artifact (#648 AC8)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name || format('marketing-shots-pr{0}-{1}', github.event.pull_request.number, github.run_id) }}
          path: ${{ env.MARKETING_OUT_DIR }}
          retention-days: ${{ inputs.retention-days || 14 }}
          if-no-files-found: warn

      # #648 follow-up — commit fresh PNGs back to `commit-back-branch` so
      # the next deploy that lands on a non-GPU fleet VM ships recent
      # images via the fallback path. Guarded on:
      #   * `commit-back-branch` set (only the deploy-pages caller does)
      #   * the ref the regen ran against matches that branch (never cross-
      #     branch commits)
      #   * at least one shot came back `outcome === 'ready'` — a run that
      #     all-skipped on software adapter contributes nothing
      #   * at least one PNG exists in MARKETING_OUT_DIR
      # The commit message carries `[skip ci]` so the push does not trigger
      # another deploy-pages run.
      - name: Commit regenerated PNGs back to ${{ inputs.commit-back-branch }}
        if: inputs.commit-back-branch != ''
        env:
          COMMIT_BACK_BRANCH: ${{ inputs.commit-back-branch }}
          COMMIT_REF: ${{ inputs.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          if [ ! -f "$MARKETING_OUT_DIR/report.json" ]; then
            echo "No report.json; nothing to commit."
            exit 0
          fi
          READY=$(node -e '
            const r = require(process.env.MARKETING_OUT_DIR + "/report.json");
            console.log((r.shots || []).filter(s => s.outcome === "ready").length);
          ')
          echo "Shots with outcome=ready: $READY"
          if [ "$READY" = "0" ]; then
            echo "::notice::Nothing to commit — every shot skipped (non-GPU fleet VM)."
            exit 0
          fi
          FRESH=$(find "$MARKETING_OUT_DIR" -maxdepth 1 -name '*.png' | wc -l)
          if [ "$FRESH" = "0" ]; then
            echo "::notice::report.json reports $READY ready, but no PNG files landed in $MARKETING_OUT_DIR. Skipping commit."
            exit 0
          fi

          echo "Overlaying $FRESH fresh PNG(s) onto docs/ and committing to $COMMIT_BACK_BRANCH."
          cp "$MARKETING_OUT_DIR"/*.png docs/

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Only touch marketing PNGs — nothing else from the checkout.
          git add docs/*.png
          if git diff --cached --quiet; then
            echo "::notice::Fresh PNGs match the committed fallback bit-for-bit; nothing to commit."
            exit 0
          fi

          # `[skip ci]` keeps the push from triggering another deploy-pages
          # run — the images we just committed are the ones that would be
          # regenerated next time anyway.
          git commit -m "chore(docs): refresh marketing screenshots from ${COMMIT_REF:0:7} [skip ci]" \
                     -m "Rendered by $RUN_URL on linux-nvidia-gpu-runner. Ready: $READY."

          # Rebase onto the current branch tip so a concurrent push doesn't
          # fail us; retry a few times on contention. A permanent failure
          # here is a notice, not a job red — the Pages artifact already
          # shipped the fresh images for THIS deploy, and the next
          # successful commit-back will catch us up.
          for attempt in 1 2 3; do
            git fetch origin "$COMMIT_BACK_BRANCH"
            if git rebase "origin/$COMMIT_BACK_BRANCH"; then
              if git push "origin" "HEAD:$COMMIT_BACK_BRANCH"; then
                echo "::notice::Committed refreshed marketing PNGs to $COMMIT_BACK_BRANCH (attempt $attempt)."
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "Attempt $attempt failed; retrying in a moment."
            sleep 3
          done
          echo "::warning::Could not commit refreshed PNGs after 3 attempts. The Pages artifact for THIS deploy still shipped the fresh images; the next successful commit-back will catch up the committed fallback."
