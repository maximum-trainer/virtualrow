name: CI (Svelte + WebGPU)

# #542 AC12 cutover: this is now the CI for `main` (the WebGPU engine is the
# app). It still gates the epic branch `next/svelte-webgpu` while that branch
# is wound down. It replaced the React-era `Playwright E2E Tests` workflow
# (`playwright-e2e-clean.yml`), retired with the React scene at the cutover.
#   * `preflight` runs lint, build, unit suite, shuffled run, coverage gate.
#   * `smoke` boots the SvelteKit scaffold.
#   * `e2e-shards` runs the Playwright specs that pass on SwiftShader today
#     (the "software-adapter"-safe subset defined in playwright.config.next.ts).
#   * `webgpu-engine` runs the engine smokes against the shared canvas on the
#     self-hosted `linux-nvidia-gpu-runner` (kill-switch: repo var
#     `GPU_RUNNER_DISABLED=true`); see the job comment below. The dedicated
#     `gpu-smoke` adapter-prober that preceded it was retired at the AC12
#     cutover — the engine smoke covers the real-GPU path end-to-end, and the
#     prober's `navigator.gpu is undefined` false-reds on fleet VMs still
#     missing the NVIDIA Vulkan ICD gave noise with no diagnostic signal the
#     engine job doesn't already carry.
#
# AC2 widens `e2e-shards` as screens stabilise under WebGPU and specs are
# ported / scene-health is re-pointed at the WebGPU engine.

on:
  push:
    branches: [ main, next/svelte-webgpu ]
  pull_request:
    branches: [ main, next/svelte-webgpu ]

permissions:
  contents: read

jobs:
  preflight:
    uses: ./.github/workflows/npm-preflight.yml

  smoke:
    # #588 FR8 / AC8 — the SvelteKit scaffold boot runs on every supported
    # SwiftShader-safe OS (Linux / Windows / macOS). The engine declines
    # software adapters, so this job stays about the shell: the title and
    # the base path. A Linux-only run would miss path-separator or
    # process-environment bugs that only show up on Windows.
    name: Scaffold smoke (SvelteKit boots at base path, ${{ matrix.os }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        # `--with-deps` only installs system libs on Linux; it's a no-op on
        # macOS/Windows, where Playwright ships the needed runtime bits.
        run: npx playwright install --with-deps chromium

      - name: Smoke — boot the scaffold
        # The config's webServer builds and previews the app at
        # /virtualrow/app/; this spec asserts the title and base path.
        run: npx playwright test --config=playwright/playwright.config.ts --project=default playwright/tests/svelte-scaffold-smoke.spec.ts

  # #542 AC2 — the Playwright e2e suite, restricted to the specs that pass
  # under SwiftShader on default runners today. See
  # `playwright/playwright.config.next.ts` for the testIgnore list; the shard
  # plan is the same measured-time split the main workflow uses, through
  # `scripts/e2e-shards.mjs`.
  #
  # The config is handed in via E2E_SHARDS_CONFIG so the shard planner lists
  # tests through it (otherwise it still asks `playwright.config.ci.ts`,
  # which would include specs this branch cannot pass yet).
  e2e-shards:
    # #588 FR8 / AC8 — the SwiftShader-safe e2e matrix runs on Linux /
    # Windows / macOS. Only the shell + non-WebGPU specs ride this (the
    # engine declines software adapters), but every OS catches
    # path-separator, process-environment, filesystem-case and font-metric
    # bugs the others would miss. The real-GPU engine smokes stay on the
    # single `linux-nvidia-gpu-runner` for continuity with its baseline.
    name: e2e shards ${{ matrix.shard }}/2 (${{ matrix.os }}, SwiftShader)
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        shard: [1, 2]
    env:
      CI: true
      E2E_SHARDS_CONFIG: playwright/playwright.config.next.ts
      # The auth-related specs call `authService.getClientId()` through
      # `.auth-button--signin`; Vite reads VITE_* at build time. The main
      # workflow (playwright-e2e-clean.yml) uses the same placeholder.
      VITE_INTERVALS_CLIENT_ID: playwright-e2e-client
      # SwiftShader fallback for WebGL contexts the UI still mounts (e.g. the
      # route detail map's WebGL leaflet / MapLibre layer). Linux-only env
      # var; harmless on macOS/Windows which pick their own software
      # rasteriser when the engine declines.
      LIBGL_ALWAYS_SOFTWARE: '1'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run shard
        run: node scripts/e2e-shards.mjs ${{ matrix.shard }}/2 --retries=2
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          # The matrix OS has to be in the name so each cell uploads to a
          # distinct artifact (actions/upload-artifact@v4 refuses two
          # uploads to the same name).
          name: next-branch-playwright-report-${{ matrix.os }}-shard-${{ matrix.shard }}
          path: playwright-report
          retention-days: 7

  webgpu-engine:
    # #550 D8-b: the engine's Playwright smokes, run on the self-hosted
    # `linux-nvidia-gpu-runner` (same runner as gpu-smoke). Now that a real
    # WebGPU adapter is reachable there, this targets the runner directly and
    # reports a real pass/fail instead of the old SwiftShader fallback leg.
    # Gated by the same `GPU_RUNNER_DISABLED` kill-switch so it skips (rather
    # than hangs) when the runner is deliberately offline.
    name: WebGPU engine smoke (#550)
    needs: preflight
    if: ${{ vars.GPU_RUNNER_DISABLED != 'true' }}
    runs-on: linux-nvidia-gpu-runner
    continue-on-error: false
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Install Vulkan runtime for the NVIDIA GPU
        # Same as gpu-smoke: the AI/HPC image lacks the Vulkan graphics
        # userspace Chromium's WebGPU backend needs, so install the loader +
        # tools + the NVIDIA ICD matching the running driver. Without it the
        # engine smokes fall back to SwiftShader instead of the real GPU.
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan1 vulkan-tools libgl1 libegl1
          DRV_MAJOR=$(nvidia-smi --query-gpu=driver_version --format=csv,noheader 2>/dev/null | head -1 | cut -d. -f1)
          if [ -n "$DRV_MAJOR" ]; then
            sudo apt-get install -y --no-install-recommends "libnvidia-gl-$DRV_MAJOR" \
              || echo "libnvidia-gl-$DRV_MAJOR not available via apt — relying on the image's own ICD"
          fi
      - name: Smoke — attach the engine, draw one frame, read telemetry
        run: npx playwright test --config=playwright/playwright.config.ts --project=default playwright/tests/webgpu-engine-smoke.spec.ts
      - name: Smoke — scenery pools + compute cull + drawIndirect (#555)
        # D7-a / D8-a: scenery runs on the same job as the engine smoke; the
        # smoke page under /smoke/scenery feeds a canned foliage pool set.
        run: npx playwright test --config=playwright/playwright.config.ts --project=default playwright/tests/webgpu-scenery-smoke.spec.ts
      - name: Smoke — flora LOD + texture pipeline (#562)
        # P5-AC4: flora LOD runs on the same job as the engine smoke; the
        # smoke page under /smoke/flora exercises the solid + sprite passes
        # and the lazy KTX2/PNG atlas path. SwiftShader is OK since the
        # decoder currently returns null → PNG fallback.
        run: npx playwright test --config=playwright/playwright.config.ts --project=default playwright/tests/webgpu-flora-smoke.spec.ts
      - name: Smoke — CSM + flora shadow depth pass (#559)
        # P4-AC4: shadows run on the same job as the engine smoke; the
        # smoke page under /smoke/shadows feeds a canned foliage pool
        # set so the shadow stage has casters.
        run: npx playwright test --config=playwright/playwright.config.ts --project=default playwright/tests/webgpu-shadows-smoke.spec.ts
      - name: Ride e2e — boot & row on the engine (#570 AC2 / #584 AC5)
        # The integrated ride specs: they drive the real /row flow and launch
        # with real WebGPU (Vulkan), so on a GPU-attached runner they assert the
        # boat actually moves, the ghost advances, world scale holds, and the
        # route curve draws. On a runner without a hardware adapter the engine
        # declines and each spec asserts the well-formed fallback instead of a
        # silent SwiftShader pass (#542 NFR5).
        run: npx playwright test --config=playwright/playwright.config.ts --project=default playwright/tests/webgpu-ride-boat-moves.spec.ts playwright/tests/webgpu-ride-ghost.spec.ts playwright/tests/webgpu-ride-world-scale.spec.ts playwright/tests/webgpu-ride-route-loading.spec.ts
      - name: AC5 ports e2e — context budget, device-lost, post-fx, scene quality (#584 AC5)
        # The four retired WebGL specs ported to the WebGPU engine: one
        # adapter + one device and zero WebGL probes; a forced device loss
        # recovers on the same canvas with the banner; post-fx draws + gpuMs>0
        # per tier; and a higher tier builds a richer scene than basic. Like
        # the ride specs they launch with real WebGPU and branch to the
        # well-formed decline on a runner without a hardware adapter (#542 NFR5).
        run: npx playwright test --config=playwright/playwright.config.ts --project=default playwright/tests/webgpu-device-budget.spec.ts playwright/tests/webgpu-device-lost-recovery.spec.ts playwright/tests/webgpu-postfx.spec.ts playwright/tests/webgpu-scene-quality-match.spec.ts
      - name: Perf-budget — gpuMs per tier (#588 FR10 / AC10)
        # Samples __ROWER3D_FRAME_STATS.gpuMs over a short settle window at
        # basic / medium / extra-high and asserts the median stays under
        # the committed per-tier cap. Branches to the well-formed decline
        # on a runner without a hardware adapter (#542 NFR5). D9-b: absolute
        # caps with headroom; a real regression (added pass, per-frame
        # upload) pushes gpuMs well above the margin.
        run: npx playwright test --config=playwright/playwright.config.ts --project=default playwright/tests/webgpu-perf-budget.spec.ts

  visual:
    # #588 FR9 / AC9 — engine visual baselines, on the real-GPU runner. The
    # pre-#625 React/three.js visual spec compared SwiftShader PNGs; the
    # WebGPU engine declines software adapters (#542 NFR5), so baselines
    # must come from a GPU-attached runner. D8-a pins the chosen platform
    # to `linux-nvidia-gpu-runner` for continuity with the engine smokes.
    #
    # Runs on every push to the gated branches and on PRs carrying the
    # `visual-baseline` label — the label gates re-record pushes so a
    # routine PR cannot accidentally overwrite committed baselines.
    name: Visual baselines (#588 FR9)
    needs: preflight
    if: >-
      ${{
        vars.GPU_RUNNER_DISABLED != 'true' &&
        (
          github.event_name == 'push' ||
          (github.event_name == 'pull_request' &&
            contains(github.event.pull_request.labels.*.name, 'visual-baseline'))
        )
      }}
    runs-on: linux-nvidia-gpu-runner
    continue-on-error: false
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Install Vulkan runtime for the NVIDIA GPU
        # Same shape as the webgpu-engine job: without the Vulkan userspace
        # + the NVIDIA ICD matching the running driver, Chromium's WebGPU
        # backend falls back to SwiftShader and the engine declines.
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan1 vulkan-tools libgl1 libegl1
          DRV_MAJOR=$(nvidia-smi --query-gpu=driver_version --format=csv,noheader 2>/dev/null | head -1 | cut -d. -f1)
          if [ -n "$DRV_MAJOR" ]; then
            sudo apt-get install -y --no-install-recommends "libnvidia-gl-$DRV_MAJOR" \
              || echo "libnvidia-gl-$DRV_MAJOR not available via apt — relying on the image's own ICD"
          fi
      - name: Run visual baselines (engine)
        # `scene.spec.ts` drives real /row via the demo path; on a VM without
        # a hardware adapter each shot `test.skip`s with a well-formed decline
        # so a routine fleet-VM gap doesn't read as a visual regression.
        run: npx playwright test --config=playwright/playwright.config.visual.ts
      - name: Upload baselines (recorded or diff)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          # Carries the recorded PNGs on a `visual-baseline` label run
          # (download, inspect, commit back) and the actual-vs-expected diff
          # images on a red PR run (triage).
          name: visual-baselines-${{ github.run_id }}
          path: |
            playwright/tests/visual/__snapshots__
            playwright-report
          if-no-files-found: ignore
          retention-days: 14
      - name: Record baselines (visual-baseline label only)
        # Only on a `visual-baseline` label the engine's `__snapshots__/` is
        # regenerated with `--update-snapshots`; a non-labelled PR cannot
        # update them, so the committed baselines are only overwritten
        # intentionally.
        if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'visual-baseline') }}
        run: npx playwright test --config=playwright/playwright.config.visual.ts --update-snapshots

  # #588 FR4 / AC4 (D3-a + D10 "every build"): StrykerJS mutation testing
  # scoped to the engine's plan layer, the smoothing/physics helper on the
  # engine seam, and the FIT encoder (`stryker.config.mjs`). Dan's
  # directive is to run it on every build, so this gates main / PRs here.
  # NFR3 cap: `timeout-minutes` keeps a hung mutant from monopolising the
  # wall clock. Report lands under `reports/mutation/mutation.html` and is
  # uploaded on every run (not only failures) so the HTML survives a green
  # run and can be compared PR-over-PR.
  mutation:
    name: Mutation testing (#588 FR4)
    needs: preflight
    runs-on: ubuntu-24.04
    env:
      CI: true
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: StrykerJS
        # The CI script keeps concurrency at 2 so the hosted runner's
        # memory holds. The HTML report writes even on a green run so
        # the artifact upload below can carry it in both cases.
        run: npm run test:mutation:ci
      - name: Upload mutation HTML report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation
          retention-days: 14
