name: Scenery generation (monthly)

# Monthly llm-cad run against new rownative courses (#449 FR1 / AC1).
#
# Diffs the current rownative index against the committed
# `scripts/scenery-generation/processed-courses.json`, invokes llm-cad
# per new course (capped by `max_new_courses`), ingests GLBs under
# `public/assets/scenery/tier-r/<course-id>/`, merges the generated
# placements into `public/assets/scenery/route-placements.json`, and
# opens a PR when the diff is non-empty.
#
# Secrets gate: without `LLM_CAD_MODEL_API_KEY` the workflow skips with
# a step-summary note and succeeds — matches the project's convention
# so a scheduled run never reddens `main`. With secrets set, generation
# runs `scripts/scenery-generation/run.mjs`, which calls
# `llm-cad generate-course` (llm-cad#42, D1), so the CI run and a local
# `node run.mjs --course-id ...` follow one path.

on:
  schedule:
    - cron: '0 4 1 * *' # 04:00 UTC on the 1st of each month (D9)
  workflow_dispatch:
    inputs:
      max_new_courses:
        description: Maximum number of new courses to process this run
        type: number
        default: 5
      llm_cad_ref:
        description: SHA / tag of MaximumTrainer/llm-cad to clone
        type: string
        default: main
      model:
        description: Model id llm-cad generates with (pinned so a re-run reproduces, FR12)
        type: string
        default: claude-opus-5-5
      dry_run:
        description: Print the planned work without writing files or opening a PR
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  generate:
    name: Generate per-route scenery
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # Needs no secret and writes nothing, so it runs on every schedule and
      # dispatch: the log always shows which courses are waiting (#449 FR2, AC2).
      - name: Plan the courses to process
        id: diff
        env:
          MAX_NEW_COURSES: ${{ inputs.max_new_courses || 5 }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -o pipefail
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/scenery-generation/plan.mjs --max "$MAX_NEW_COURSES" --dry-run | tee -a "$GITHUB_STEP_SUMMARY"
          else
            node scripts/scenery-generation/plan.mjs --max "$MAX_NEW_COURSES" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: "Guard: skip generation when LLM_CAD_MODEL_API_KEY is absent"
        id: guard
        env:
          LLM_CAD_MODEL_API_KEY: ${{ secrets.LLM_CAD_MODEL_API_KEY }}
        run: |
          if [ -z "${LLM_CAD_MODEL_API_KEY}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Generation skipped"
              echo ""
              echo "LLM_CAD_MODEL_API_KEY is not set, so no models are generated. This matches the convention from the project's other optional jobs so a scheduled run never reddens \`main\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python for llm-cad
        if: steps.guard.outputs.skip != 'true' && inputs.dry_run != true && steps.diff.outputs.courses != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies and llm-cad
        if: steps.guard.outputs.skip != 'true' && inputs.dry_run != true && steps.diff.outputs.courses != ''
        env:
          LLM_CAD_REF: ${{ inputs.llm_cad_ref || 'main' }}
        run: |
          npm ci
          python3 -m pip install uv
          git clone https://github.com/MaximumTrainer/llm-cad "${RUNNER_TEMP}/llm-cad"
          git -C "${RUNNER_TEMP}/llm-cad" checkout "${LLM_CAD_REF}"
          echo "llm-cad at $(git -C "${RUNNER_TEMP}/llm-cad" rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          uv sync --directory "${RUNNER_TEMP}/llm-cad"

      # One path for CI and a local run (FR10 / AC11): run.mjs fetches each
      # course, calls `llm-cad generate-course`, enforces the size caps and
      # merges placements and the snapshot. A failed course is reported, not fatal.
      - name: Generate and ingest scenery
        id: generate
        if: steps.guard.outputs.skip != 'true' && inputs.dry_run != true && steps.diff.outputs.courses != ''
        env:
          COURSES: ${{ steps.diff.outputs.courses }}
          LLM_CAD_MODEL_API_KEY: ${{ secrets.LLM_CAD_MODEL_API_KEY }}
          MODEL: ${{ inputs.model || 'claude-opus-5-5' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/scenery-generation/run.mjs --courses "${COURSES}" \
            --llm-cad-dir "${RUNNER_TEMP}/llm-cad" --model "${MODEL}" \
            --run-url "${RUN_URL}" --run-id "${{ github.run_id }}" \
            --summary "${RUNNER_TEMP}/scenery-summary.md"
          cat "${RUNNER_TEMP}/scenery-summary.md" >> "$GITHUB_STEP_SUMMARY"
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      # Compress, build LOD1s and regenerate the manifest like the rest of the kit (D12).
      - name: Build the kit assets
        if: steps.generate.outputs.landed != '' && steps.generate.outputs.landed != '0'
        run: npm run build:assets

      - name: Open PR with generated scenery
        if: steps.generate.outputs.landed != '' && steps.generate.outputs.landed != '0'
        # Third-party action with a write token: pinned to a commit (#449 NFR1). v7.0.11.
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676
        with:
          # D10: a PAT or App token so the PR's CI runs; GITHUB_TOKEN cannot trigger it.
          token: ${{ secrets.SCENERY_GEN_GITHUB_TOKEN || github.token }}
          commit-message: "chore(scenery): llm-cad run ${{ steps.generate.outputs.month }}"
          title: "Scenery generation — ${{ steps.generate.outputs.month }} (${{ steps.generate.outputs.landed }} new courses)"
          branch: scenery/generate-${{ github.run_id }}
          delete-branch: true
          labels: scenery-generation,automated
          add-paths: |
            public/assets/scenery/**
            scripts/scenery-generation/processed-courses.json
            assets-src/scenery/compression-report.json
          body-path: ${{ runner.temp }}/scenery-summary.md
