name: Geo proxy Worker

# Tests and type-checks workers/geo-proxy (#762). The Worker has its own
# package, tsconfig and test runner; the root lint and unit suite skip it.
# Deploying is a manual `npx wrangler deploy` (see workers/geo-proxy/README.md).

on:
  pull_request:
    paths:
      - 'workers/geo-proxy/**'
      - '.github/workflows/geo-proxy.yml'
  push:
    branches: [main]
    paths:
      - 'workers/geo-proxy/**'

permissions:
  contents: read

jobs:
  test:
    name: Worker tests and types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/geo-proxy
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: workers/geo-proxy/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test
