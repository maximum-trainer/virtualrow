name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'src/**'
      - 'static/**'
      - 'public/**'
      - 'svelte.config.js'
      - 'package*.json'
      - 'vite.config.ts'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/regen-marketing-shots.yml'
      - 'playwright/visual/marketing-shots.ts'
      - 'playwright/tests/visual/marketing-screenshots.spec.ts'
      - 'playwright/playwright.config.marketing.ts'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between
# the run in-progress and latest queued. Cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # #648 FR1/FR2/AC1/AC4/AC7 — regenerate the published marketing screenshots
  # on the real-GPU runner before every deploy. Gated by `GPU_RUNNER_DISABLED`
  # so a fleet outage skips (not fails) the regen; the deploy job overlays
  # fresh PNGs on top of the committed last-known-good fallback and keeps
  # going when the regen artifact is missing (#648 FR8 / D5).
  #
  # commit-back-branch: on a successful real-GPU run the regen job pushes
  # the fresh PNGs back to `main` with `[skip ci]`, so the committed
  # `docs/*.png` are a self-updating cache. The next deploy that lands on a
  # non-GPU fleet VM then ships the just-committed PNGs rather than the
  # pre-cutover baselines (#648 follow-up to D2).
  regen-marketing-shots:
    name: Regenerate marketing screenshots (#648)
    if: ${{ vars.GPU_RUNNER_DISABLED != 'true' }}
    uses: ./.github/workflows/regen-marketing-shots.yml
    with:
      ref: ${{ github.sha }}
      artifact-name: marketing-shots-${{ github.run_id }}
      commit-back-branch: main
    secrets: inherit
    permissions:
      contents: write

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-24.04
    # `always()` so the deploy still runs when `regen-marketing-shots` is
    # skipped (kill-switch set) or fails (#648 FR8 / AC7 / AC11). The deploy
    # job itself decides what to publish: fresh regen PNGs if present, the
    # committed fallback otherwise.
    needs: [regen-marketing-shots]
    if: always()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_try_2.outputs.page_url || steps.deployment_try_1.outputs.page_url }}
    steps:
      # #542 AC12 cutover: the live app at /virtualrow/app/ is now the
      # SvelteKit + hand-written-WebGPU build (adapter-static, SPA fallback).
      # This replaced the React/Vite build and the separate /virtualrow/next/
      # preview, both retired with the React scene when `next` merged to `main`.
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the WebGPU app for GitHub Pages
        # svelte.config.js reads BASE_PATH (default /virtualrow/app) for
        # `paths.base`; adapter-static writes the static SPA to build/.
        run: npm run build
        env:
          NODE_ENV: production
          BASE_PATH: /virtualrow/app
          VITE_INTERVALS_CLIENT_ID: ${{ secrets.INTERVALS_OAUTH_CLIENT_ID }}
          # #473 FR4/FR5: bake the deploy's commit SHA into the client so a
          # crash report says which build crashed. `github.sha` is the full
          # 40-char SHA; the service truncates in `redactCrashPayload`.
          VITE_BUILD_SHA: ${{ github.sha }}
          # #473 Phase 3 (D1 = a): the real `repository_dispatch` endpoint
          # and token. When either is unset the stub transport stays in
          # place and the service short-circuits on `no-endpoint` (FR5), so
          # a build without these two secrets ships green and silent.
          VITE_CRASH_REPORT_ENDPOINT: ${{ secrets.CRASH_REPORT_ENDPOINT }}
          VITE_CRASH_REPORT_TOKEN: ${{ secrets.CRASH_REPORT_TOKEN }}

      - name: Copy app build into docs/app/
        run: |
          mkdir -p docs/app
          cp -r build/. docs/app/

      # #648 FR5 / AC1 / AC9 — overlay the freshly regenerated screenshots on
      # top of docs/ before the Pages artifact is packed. The committed PNGs
      # under docs/ are the last-known-good fallback (#648 D2 = a): if the
      # regen job skipped (GPU_RUNNER_DISABLED) or failed, nothing is
      # downloaded and docs/ keeps those fallbacks (#648 D5 = b / AC7).
      - name: Download regenerated marketing screenshots
        id: regen_download
        if: needs.regen-marketing-shots.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: marketing-shots-${{ github.run_id }}
          path: regen-marketing-shots

      - name: Overlay regenerated marketing screenshots onto docs/
        id: regen_overlay
        if: steps.regen_download.outcome == 'success'
        run: |
          set -e
          echo "regenerated artifact contents:"
          ls -lh regen-marketing-shots/ || true
          # Only overlay PNGs — report.json is published alongside as an
          # artifact (#648 AC8), not as part of the Pages site. Count what
          # was overlaid so `Report regen outcome` below can tell "fresh"
          # from "fleet-VM gap, no PNGs produced" cleanly (#648 FR8 / D5).
          OVERLAY_COUNT=$(find regen-marketing-shots -maxdepth 1 -name '*.png' | wc -l)
          echo "overlay_count=$OVERLAY_COUNT" >> "$GITHUB_OUTPUT"
          if [ "$OVERLAY_COUNT" -gt 0 ]; then
            find regen-marketing-shots -maxdepth 1 -name '*.png' -print0 \
              | xargs -0 -I{} cp {} docs/
          fi
          echo "docs/ after overlay:"
          ls -lh docs/*.png

      # #648 AC5 — structural sanity on the published hero + gallery. Runs
      # against the actual files that will be published (whether fresh or
      # fallback). A blank/undersized hero fails the deploy.
      - name: Hero screenshot structural sanity (#648 AC5)
        run: |
          npx vitest run \
            src/__tests__/heroScreenshot.test.ts \
            src/__tests__/docsHeroDimensions.test.ts

      - name: Report regen outcome
        if: always()
        run: |
          REGEN="${{ needs.regen-marketing-shots.result }}"
          OVERLAID="${{ steps.regen_overlay.outputs.overlay_count || '0' }}"
          echo "regen-marketing-shots result: $REGEN"
          echo "PNGs overlaid onto docs/: $OVERLAID"
          if [ "$REGEN" = "success" ] && [ "$OVERLAID" -gt 0 ]; then
            echo "::notice::Pages publishing $OVERLAID freshly regenerated marketing screenshot(s)."
          elif [ "$REGEN" = "success" ]; then
            # Regen job completed but produced no PNGs — the GPU runner landed
            # on a fleet VM without the NVIDIA Vulkan ICD and every shot
            # skipped. Site stays on the committed fallback (#648 FR8 / D5).
            echo "::notice::Regen landed on a non-GPU fleet VM — Pages publishing committed fallback marketing screenshots."
          else
            echo "::notice::Pages publishing committed fallback marketing screenshots (regen=$REGEN)."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages (attempt 1)
        id: deployment_try_1
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Deploy to GitHub Pages (attempt 2)
        id: deployment_try_2
        if: steps.deployment_try_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Deploy to GitHub Pages (attempt 3)
        id: deployment
        if: steps.deployment_try_1.outcome == 'failure' && steps.deployment_try_2.outcome == 'failure'
        uses: actions/deploy-pages@v5
